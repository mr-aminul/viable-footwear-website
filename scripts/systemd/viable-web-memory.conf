# Drop-in: /etc/systemd/system/viable-web.service.d/memory.conf
# Installed by scripts/deploy-vps.sh — keeps Viable from eating the whole VPS,
# with enough headroom for /api/media + Facebook/Instagram ad traffic.
# MemoryMax alone can freeze Next (cgroup reclaim) instead of killing it — pair with
# OOMPolicy=kill + Restart=always, and scripts/viable-web-watchdog.sh for hung :3000.
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=1536
MemoryMax=1800M
MemoryHigh=1600M
OOMPolicy=kill
Restart=always
RestartSec=5
ManagedOOMMemoryPressure=kill
