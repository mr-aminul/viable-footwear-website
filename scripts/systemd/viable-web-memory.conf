# Drop-in: /etc/systemd/system/viable-web.service.d/memory.conf
# Installed by scripts/deploy-vps.sh — keeps Viable from eating the whole VPS,
# with enough headroom for /api/media + Facebook/Instagram ad traffic.
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=768
MemoryMax=900M
MemoryHigh=800M
